students.forEach(s=>{let o=document.createElement('option');o.value=s.name;dl.appendChild(o);});
function searchStudent(){
let q=document.getElementById('q').value.trim().toLowerCase();
let s=students.find(x=>x.name.toLowerCase()===q);

if(!s){r.innerHTML='<h3 style="color:#b00020">Student Not Found</h3>';return;}

}
